{% extends 'tasks/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3>{% if tache %}Modifier{% else %}Nouvelle{% endif %} Tâche</h3>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Titre *</label>
                        <input type="text" name="titre" class="form-control" 
                               value="{{ tache.titre|default:'' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ tache.description|default:'' }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Date limite</label>
                        <input type="date" name="date_limite" class="form-control"
                               value="{{ tache.date_limite|default:'' }}">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Statut</label>
                        <select name="statut" class="form-select">
                            <option value="todo" {% if tache.statut == 'todo' %}selected{% endif %}>À faire</option>
                            <option value="en_cours" {% if tache.statut == 'en_cours' %}selected{% endif %}>En cours</option>
                            <option value="termine" {% if tache.statut == 'termine' %}selected{% endif %}>Terminé</option>
                        </select>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            {% if tache %}Sauvegarder{% else %}Créer{% endif %}
                        </button>
                        <a href="{% url 'liste_taches' %}" class="btn btn-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
